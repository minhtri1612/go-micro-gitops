apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    if obj.spec and obj.spec.rules and #obj.spec.rules > 0 then
      hs.status = "Healthy"
      hs.message = "Ingress rules present"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for ingress rules"
    return hs
