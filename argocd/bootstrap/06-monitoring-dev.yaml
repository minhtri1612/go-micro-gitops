apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: dev
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 61.3.2
      helm:
        valueFiles:
          - $values/monitoring/monitoring-workload.yaml
          - $values/monitoring/monitoring-workload-labels-dev.yaml
    - repoURL: https://github.com/minhtri1612/go-micro-infra.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/minhtri1612/go-micro-infra.git
      targetRevision: main
      path: monitoring
      directory:
        include: "prometheus-global-workload.yaml"
  destination:
    name: dev
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
