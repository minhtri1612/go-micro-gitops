apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: dev
  source:
    repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: 28.3.0
    helm:
      releaseName: traefik
      values: |
        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
        ingressClass:
          enabled: true
          isDefaultClass: true
        service:
          type: NodePort
        metrics:
          prometheus:
            enabled: true
            addEntryPointsLabels: true
            addServicesLabels: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring-dev
        ports:
          metrics:
            port: 9100
            expose:
              default: true
          web:
            nodePort: 32080
          websecure:
            nodePort: 32443
  destination:
    name: dev
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
