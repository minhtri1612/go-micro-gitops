apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: dev
  source:
    repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: 28.3.0
    helm:
      releaseName: traefik
      values: |
        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
        ingressClass:
          enabled: true
          isDefaultClass: true
        service:
          type: LoadBalancer
  destination:
    name: dev
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
