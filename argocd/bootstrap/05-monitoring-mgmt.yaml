apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 61.3.2
      helm:
        valueFiles:
          - $values/monitoring/monitoring-mgmt.yaml
    - repoURL: https://github.com/minhtri1612/go-micro.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/minhtri1612/go-micro.git
      targetRevision: main
      path: monitoring
      directory:
        include: 'prometheus-global-management.yaml'
    - repoURL: https://github.com/minhtri1612/go-micro.git
      targetRevision: main
      path: monitoring
      directory:
        include: 'grafana-dashboard-*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
