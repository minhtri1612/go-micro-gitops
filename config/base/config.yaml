projectName: go-micro
secretStoreName: aws-secrets-manager
region: ap-southeast-2

product:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: PRODUCT_DB_NAME

