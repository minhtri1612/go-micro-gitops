env: staging
projectName: go-micro

routing:
  provider: traefik

traefik:
  enabled: true
  hostname: staging.go-micro.local
  stableWeight: 95
  canaryWeight: 5
  darkLaunch: true   # Staging: QA team dùng header X-Canary: true để test

ciliumNetworkPolicy:
  enabled: false
  authenticationMode: ""

rollout:
  enabled: true
  strategy: canary
  analysis:
    enabled: false
    prometheusAddress: http://172.18.255.45
    load:
      vus: 20
      duration: 45s
      errorRate: 0.05
    thresholds:
      latencyP95: 0.3
      latencyCount: 5
      latencyFailureLimit: 0
      successRate: 0.90
      successCount: 8
      successInitialDelay: 60s
      successFailureLimit: 2
  canary:
    steps:
      - setWeight: 1
      - pause:
          duration: 2m
      - setWeight: 20
      - pause: {}
      - setWeight: 50
      - pause: {}
      - setWeight: 80
      - pause: {}
      - setWeight: 100

product:
  namespace: microservices-staging
  secrets:
    target:
      name: go-micro-product-secrets-staging
    remoteKey: go-micro/staging/app-credentials

inventory:
  namespace: microservices-staging
  secrets:
    target:
      name: go-micro-inventory-secrets-staging
    remoteKey: go-micro/staging/app-credentials

order:
  namespace: microservices-staging
  secrets:
    target:
      name: go-micro-order-secrets-staging
    remoteKey: go-micro/staging/app-credentials

noti:
  namespace: microservices-staging
  secrets:
    target:
      name: go-micro-noti-secrets-staging
    remoteKey: go-micro/staging/app-credentials

payment:
  namespace: microservices-staging
  secrets:
    target:
      name: go-micro-payment-secrets-staging
    remoteKey: go-micro/staging/app-credentials

client:
  rollout:
    analysis:
      thresholds:
        # Frontend client uses different telemetry than gin-based backend services.
        successRate: 0
        successFailureLimit: 1

podMonitor:
  enabled: true
  interval: 15s
  release: monitoring-management
