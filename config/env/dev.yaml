env: dev
projectName: go-micro

routing:
  provider: traefik

traefik:
  enabled: true
  hostname: dev.go-micro.local
  stableWeight: 90
  canaryWeight: 10
  darkLaunch: true   # QA/Dev dùng header X-Canary: true để test canary trực tiếp

ciliumNetworkPolicy:
  enabled: false
  authenticationMode: ""

rollout:
  enabled: true
  strategy: canary
  analysis:
    enabled: false
    prometheusAddress: http://172.18.255.45
    load:
      vus: 10
      duration: 30s
      errorRate: 0.1
    thresholds:
      latencyP95: 1.0
      latencyCount: 3
      latencyFailureLimit: 1
      successRate: 0.82
      successCount: 5
      successInitialDelay: 45s
      successFailureLimit: 3
  canary:
    # Một pause: {} duy nhất (sau 20%) = chờ Jenkins gate + promote. Các bước sau dùng pause có duration
    # để vẫn chạy lần lượt 50→80→100 mà không cần bấm promote thêm.
    steps:
      - setWeight: 1
      - pause:
          duration: 30s
      - setWeight: 20
      - pause: {}
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100

product:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-product-secrets-dev
    remoteKey: go-micro/dev/app-credentials

inventory:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-inventory-secrets-dev
    remoteKey: go-micro/dev/app-credentials

order:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-order-secrets-dev
    remoteKey: go-micro/dev/app-credentials

noti:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-noti-secrets-dev
    remoteKey: go-micro/dev/app-credentials

payment:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-payment-secrets-dev
    remoteKey: go-micro/dev/app-credentials

client:
  rollout:
    analysis:
      thresholds:
        # Frontend client does not expose gin_request_* metrics like Go backend services.
        # Keep canary checks focused on smoke/dependency/k6 in dev.
        successRate: 0
        successFailureLimit: 1

podMonitor:
  enabled: true
  interval: 15s
  release: monitoring-management # Quan trọng: Phải khớp với release name của Prometheus Operator
