env: dev

# Kind 1 node: start at one replica. HPA stays on; minReplicas 1 so client.yaml min=2 does not pin two pods.
autoscaling:
  minReplicas: 1

# Service-specific overrides

product:
  image:
    tag: "product-service-666496c"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

inventory:
  image:
    tag: "inventory-service-cdd9c9b"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

order:
  image:
    tag: "order-service-bbdf4e6"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

payment:
  image:
    tag: "payment-service-9f78c82"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

noti:
  image:
    tag: "notification-service-9d0751d"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

client:
  image:
    tag: "client-v1.0.2"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

# Database services
product-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

inventory-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

order-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

payment-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

notification-db:
  image:
    tag: "15-alpine"
  replicaCount: 1
