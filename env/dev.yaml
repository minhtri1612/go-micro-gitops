env: dev

# Dev/prod: start at one replica. HPA stays on; minReplicas 1 so client.yaml min=2 does not pin two pods.
autoscaling:
  minReplicas: 1

# Service-specific overrides

product:
  image:
    tag: "product-service-1525975"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

inventory:
  image:
    tag: "inventory-service-ecfc94f"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

order:
  image:
    tag: "order-service-a13909a"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

payment:
  image:
    tag: "payment-service-c0511d7"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

noti:
  image:
    tag: "notification-service-a3b3766"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

client:
  image:
    tag: "client-4c6d7e9"
  replicaCount: 1
  rollout:
    enabled: true
    strategy: canary

# Database services
product-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

inventory-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

order-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

payment-db:
  image:
    tag: "15-alpine"
  replicaCount: 1

notification-db:
  image:
    tag: "15-alpine"
  replicaCount: 1
