# Order Service - Override values for template/values.yaml
replicaCount: 1

image:
  repository: minhtri1612/go-microservice
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/metrics"

podMonitor:
  enabled: true

useExternalSecrets: true
workloadKind: rollout
extraEnv:
  - name: PRODUCT_SERVICE_URL
    value: http://product:8080
  - name: INVENTORY_SERVICE_URL
    value: http://inventory:8082
  - name: PAYMENT_SERVICE_URL
    value: http://payment:8084
  - name: NOTIFICATION_SERVICE_URL
    value: http://noti:8083

routing:
  provider: traefik

traefik:
  enabled: true
  pathPrefix: /api/v1/orders
  stripPrefixes:
    - /api/v1/orders
  ingressRouteForServices:
    - order

rollout:
  enabled: true
  revisionHistoryLimit: 3

ciliumNetworkPolicy:
  enabled: false
  services:
    - order