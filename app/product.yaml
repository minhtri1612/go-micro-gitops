# Product Service - Override values for template/values.yaml
replicaCount: 1

image:
  repository: minhtri1612/go-microservice
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podMonitor:
  enabled: true

useExternalSecrets: true
workloadKind: rollout

routing:
  provider: traefik

traefik:
  enabled: true
  pathPrefix: /api/v1/products
  stripPrefixes:
    - /api/v1/products
  ingressRouteForServices:
    - product

rollout:
  enabled: true
  revisionHistoryLimit: 3

ciliumNetworkPolicy:
  enabled: false
  services:
    - product