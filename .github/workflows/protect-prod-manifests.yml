name: protect-prod-manifests

on:
  pull_request:
    paths:
      - env/prod/**
      - config/env/prod.yaml

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Allow prod tag edits only from Jenkins promote branches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          payload="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${PR_URL}/files?per_page=100")"
          rows="$(echo "${payload}" | jq -r '.[] | "\(.status)\t\(.filename)"')"
          echo "Changed files:"
          echo "${rows}"

          tag_re='^env/prod/(product|inventory|order|payment|noti|client)\.yaml$'
          added_tags="$(echo "${rows}" | awk -F'\t' -v re="${tag_re}" '$1=="added" && $2 ~ re {print $2}')"
          changed_tags="$(echo "${rows}" | awk -F'\t' -v re="${tag_re}" '$1!="added" && $2 ~ re {print $2}')"
          all_files="$(echo "${rows}" | cut -f2)"

          if [[ -n "${added_tags}" ]]; then
            echo "New prod tag files allowed (bootstrap / new service):"
            echo "${added_tags}"
          fi

          if [[ -n "${changed_tags}" ]]; then
            if [[ "${HEAD_REF}" != ci/promote-* ]]; then
              echo "Sửa tag prod chỉ trên branch ci/promote-* (Jenkins TARGET_ENV=prod → PR)."
              echo "${changed_tags}"
              exit 1
            fi
            extra="$(echo "${all_files}" | grep -v -E "${tag_re}" || true)"
            if [[ -n "${extra}" ]]; then
              echo "Promote PR chỉ được đụng file tag prod. Thừa:"
              echo "${extra}"
              exit 1
            fi
            count="$(echo "${changed_tags}" | grep -c .)"
            if [[ "${count}" -ne 1 ]]; then
              echo "Promote PR chỉ được đụng đúng 1 file tag prod."
              echo "${changed_tags}"
              exit 1
            fi
          fi

          if echo "${all_files}" | grep -qx 'config/env/prod.yaml'; then
            if [[ -n "${changed_tags}" ]]; then
              echo "Đừng gộp config/env/prod.yaml với promote tag."
              exit 1
            fi
          fi
