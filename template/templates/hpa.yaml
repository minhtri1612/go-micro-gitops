{{- if .Values.autoscaling.enabled }}
{{- $wk := .Values.workloadKind | default "deployment" | lower }}
{{- if ne $wk "statefulset" }}
{{- $cs := .Values.currentService | default "" }}
{{- $svc := (index .Values $cs) | default dict }}
{{- $backend := .Values.backend | default dict }}
{{- $rolloutCfg := deepCopy (.Values.rollout | default dict) }}
{{- if and (not (hasSuffix "-db" $cs)) (hasKey $backend "rollout") }}
{{- $rolloutCfg = mergeOverwrite $rolloutCfg ($backend.rollout | default dict) }}
{{- end }}
{{- if hasKey $svc "rollout" }}
{{- $rolloutCfg = mergeOverwrite $rolloutCfg ($svc.rollout | default dict) }}
{{- end }}
{{- $rolloutEnabled := $rolloutCfg.enabled | default false }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "template.fullname" . }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    {{- if $rolloutEnabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ include "template.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
